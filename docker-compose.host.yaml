---
# UniFi OS Server on the host network: no port mapping, no discovery sidecar, the container sees your
# LAN directly. Read "Networking" in the README first: every port the container opens is a host port.
services:
  unifi-os-server:
    image: ghcr.io/mordillosan/unifi-os-server:latest
    container_name: unifi-os-server
    tty: true # systemd boot status ([ OK ] / Failed to start) shows up in docker logs
    network_mode: host
    cgroup: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    extra_hosts:
      host.docker.internal: host-gateway
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    environment:
      - UOS_SYSTEM_IP=unifi.example.com
      # - UOS_LOG_LEVEL=info      # docker logs: everything the applications log, not only warnings and errors
      # - UOS_LOG_TIMESTAMP=false # docker logs: drop the time
      # - UOS_LOG_SOURCE=false    # docker logs: drop the source (unifi-core:, unifi:, postgres:, systemd:)
      # - UOS_LOG_COLOR=false     # docker logs: no ANSI colors
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /path/to/unifi-os-server/persistent:/persistent
      - /path/to/unifi-os-server/var-log:/var/log
      - /path/to/unifi-os-server/data:/data
      - /path/to/unifi-os-server/srv:/srv
      - /path/to/unifi-os-server/var-lib-unifi:/var/lib/unifi
      - /path/to/unifi-os-server/var-lib-mongodb:/var/lib/mongodb
      - /path/to/unifi-os-server/etc-rabbitmq-ssl:/etc/rabbitmq/ssl
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
