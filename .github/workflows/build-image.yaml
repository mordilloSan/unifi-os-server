name: Build and push unifi-os-server image

on:
  release:
    types: [published]
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - 'docker-compose.yaml'
      - 'renovate.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mordillosan/unifi-os-server

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      
      - name: Log in to the Container registry
        if: github.actor != 'dependabot[bot]' # Dependabot runs get a read-only token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Releases are tagged v<UniFi OS Server version>-<image revision>, e.g. v5.1.42-1, which
          # metadata-action's semver type would treat as a pre-release (no latest, no v5.1.42). So:
          #   v5.1.42-1  exact build          v5.1.42  newest build of that UniFi version
          #   v5.1       newest of the line   latest   newest release (auto for tag and match)
          # Pushes to other branches publish a tag named after the branch.
          tags: |
            type=ref,event=tag
            type=match,pattern=^(v\d+\.\d+\.\d+)-\d+$,group=1
            type=match,pattern=^(v\d+\.\d+)\.\d+-\d+$,group=1
            type=ref,event=branch
          flavor: |
            latest=auto
      
      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max