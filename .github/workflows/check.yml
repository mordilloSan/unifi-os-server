name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the run it makes outdated; a run on main is never cancelled once it starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHFMT_VERSION: v3.14.1
  SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image has shellcheck, python3 and docker compose but no shfmt.
      - name: Install shfmt
        run: |
          curl -fsSLo "$RUNNER_TEMP/shfmt" "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $RUNNER_TEMP/shfmt" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/shfmt"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint scripts and compose files
        run: make lint
